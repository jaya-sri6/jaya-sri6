<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous Delivery Resolution Agent</title>
  <desc id="desc">Python, LangGraph, MCP, and n8n multi-agent workflow. About 87 percent successful resolution across 150 plus simulated incidents.</desc>
  <defs>
    <linearGradient id="delivery-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <linearGradient id="delivery-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#701A3D"/><stop offset=".55" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity=".12"/></linearGradient>
  </defs>
  <rect width="560" height="360" rx="16" fill="url(#delivery-bg)" stroke="#701A3D"/>
  <text x="26" y="34" fill="#C77B9B" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">01 / PYTHON · LANGGRAPH · MCP · n8n</text>
  <path d="M26 47H534" stroke="url(#delivery-line)"/>
  <text x="28" y="111" fill="#E5B5C7" font-family="Georgia, serif" font-size="42">~87%</text>
  <text x="171" y="91" fill="#F8F0F3" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">SUCCESSFUL</text>
  <text x="171" y="110" fill="#F8F0F3" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">RESOLUTION</text>
  <text x="29" y="137" fill="#BCA7B0" font-family="Arial, sans-serif" font-size="12">Across 150+ simulated incidents</text>
  <g transform="translate(397 70)" fill="#451126" stroke="#C77B9B">
    <rect x="0" y="0" width="36" height="34" rx="8"/><rect x="58" y="0" width="36" height="34" rx="8"/><rect x="116" y="0" width="36" height="34" rx="8"/>
    <path d="M36 17h22m36 0h22" fill="none"/>
    <circle cx="18" cy="17" r="4" fill="#E5B5C7"/><circle cx="76" cy="17" r="4" fill="#E5B5C7"/><circle cx="134" cy="17" r="4" fill="#E5B5C7"/>
  </g>
  <text x="28" y="191" fill="#F8F0F3" font-family="Georgia, serif" font-size="24">Autonomous Delivery</text>
  <text x="28" y="221" fill="#E5B5C7" font-family="Georgia, serif" font-size="24">Resolution Agent</text>
  <text x="29" y="244" fill="#A98C99" font-family="Arial, sans-serif" font-size="11">Multi-agent workflow for last-mile delivery disruptions.</text>
  <path d="M29 277H531" stroke="#451126"/>
  <text x="29" y="308" fill="#C77B9B" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.5">INCIDENT  →  SPECIALIST AGENTS  →  RESOLUTION</text>
  <g fill="#190B12" stroke="#701A3D">
    <rect x="29" y="324" width="112" height="22" rx="11"/>
    <rect x="150" y="324" width="112" height="22" rx="11"/>
    <rect x="271" y="324" width="112" height="22" rx="11"/>
  </g>
  <g fill="#E5B5C7" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">
    <text x="85" y="339">LANGGRAPH</text>
    <text x="206" y="339">MCP</text>
    <text x="327" y="339">n8n</text>
  </g>
</svg>
