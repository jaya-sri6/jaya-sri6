<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112" width="1200" height="112" role="img" aria-labelledby="projects-title projects-desc">
  <title id="projects-title">02 — Selected work</title>
  <desc id="projects-desc">A selection of projects across agents, AI, and software engineering.</desc>
  <defs>
    <linearGradient id="projects-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/>
      <stop offset=".6" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="projects-glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5B5C7"/>
      <stop offset=".5" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="112" rx="10" fill="#10070C"/>
  <text x="40" y="28" fill="#C77B9B" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3"><tspan fill="#E5B5C7">02</tspan>  SELECTED WORK</text>
  <text x="38" y="77" fill="#F8F0F3" font-family="Georgia, 'Times New Roman', serif" font-size="43" letter-spacing="-.7">Ideas into <tspan font-style="italic" fill="url(#projects-glint)">systems.</tspan></text>
  <path d="M40 99H1160" stroke="url(#projects-sheen)" stroke-width="1"/>
  <circle cx="40" cy="99" r="2.5" fill="#E5B5C7"/>
