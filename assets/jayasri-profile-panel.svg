    <text x="801" y="95" fill="#F8F0F3" font-family="Georgia, 'Times New Roman', serif" font-size="24">Agentic systems</text>
    <text x="801" y="123" fill="#BCA7B0" font-family="Arial, Helvetica, sans-serif" font-size="12">RAG · multi-agent workflows · LLM applications</text>

