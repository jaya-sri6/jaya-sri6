    <text x="61" y="399" fill="#F8F0F3" font-size="12">Plasmid    / AI / Backend Intern      / Apr 2024 — Jun 2024</text>
    <circle cx="63" cy="419" r="3" fill="#E5B5C7">
      <animate attributeName="opacity" values="1;.18;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="778" y="32" width="388" height="119" rx="14" fill="#190B12" stroke="#451126"/>
