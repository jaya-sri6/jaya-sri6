<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 465" width="1200" height="465" role="img" aria-labelledby="profile-title profile-desc">
  <title id="profile-title">Jayasri's profile and experience</title>
  <desc id="profile-desc">Education at SRM Institute of Science and Technology and three verified internship entries from Jayasri's public portfolio.</desc>
  <defs>
    <linearGradient id="profile-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="profile-rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset=".55" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity=".12"/>
    </linearGradient>
    <pattern id="profile-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#E5B5C7" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="465" rx="18" fill="url(#profile-bg)"/>
  <rect width="1200" height="465" rx="18" fill="url(#profile-grid)"/>

  <rect x="34" y="32" width="712" height="401" rx="14" fill="#10070C" stroke="#701A3D" stroke-opacity=".64"/>
  <path d="M48 82H732" stroke="#451126"/>
  <circle cx="57" cy="57" r="4" fill="#701A3D"/>
  <circle cx="72" cy="57" r="4" fill="#C77B9B" opacity=".74"/>
