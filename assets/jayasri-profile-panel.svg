    <text x="801" y="343" fill="#C77B9B" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">03 / PRINCIPLE</text>
    <text x="801" y="377" fill="#F8F0F3" font-family="Georgia, 'Times New Roman', serif" font-size="24">Build with intent</text>
