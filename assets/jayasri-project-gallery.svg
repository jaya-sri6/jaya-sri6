<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="work-title work-desc">
  <title id="work-title">Selected projects</title>
  <desc id="work-desc">Six projects: Autonomous Delivery Resolution Agent, DualMind AI, Echo, TeamBridge MCP, Agentic Workflow Automation System, and LLM RAG Document Processing System. The delivery agent achieved about 87 percent successful resolution across more than 150 simulated incidents.</desc>
  <defs>
    <linearGradient id="work-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="work-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#701A3D"/>
      <stop offset=".6" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="work-metric" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
    <pattern id="work-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E5B5C7" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="700" rx="18" fill="url(#work-bg)"/>
