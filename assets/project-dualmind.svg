  <text x="29" y="148" fill="#BCA7B0" font-family="Arial, sans-serif" font-size="13">Compare two AI assistants side by side.</text>
  <text x="29" y="171" fill="#BCA7B0" font-family="Arial, sans-serif" font-size="13">Evaluate quality, safety, reliability, and cost.</text>
