<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">DualMind AI</title>
  <desc id="desc">Python platform for comparing and evaluating AI assistants.</desc>
  <defs>
