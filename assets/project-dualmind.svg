    <linearGradient id="dualmind-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#701A3D"/><stop offset=".55" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity=".12"/></linearGradient>
  </defs>
  <rect width="560" height="360" rx="16" fill="url(#dualmind-bg)" stroke="#701A3D"/>
  <text x="26" y="34" fill="#C77B9B" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">02 / PYTHON · AI EVALUATION</text>
